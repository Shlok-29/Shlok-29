<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" class="futuristic-portrait-svg">
  <defs>
    <!-- Radial Backlight Glow -->
    <radialGradient id="cyberBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Metallic Suit Gradient -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Lapel Highlight Gradient -->
    <linearGradient id="lapelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Glass Lens Reflection Gradient -->
    <linearGradient id="lensReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Skin Contour Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="50%" stop-color="#1a202c"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND GLOW & GRID BASE -->
  <circle cx="300" cy="300" r="260" fill="url(#cyberBgGlow)" />

  <!-- DECORATIVE OUTER TECH RINGS & HUD ARCS -->
  <g class="hud-ring-outer">
    <circle cx="300" cy="300" r="270" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.25" fill="none" stroke-dasharray="8 6 12 6" />
    <circle cx="300" cy="300" r="255" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3" fill="none" stroke-dasharray="40 20 80 20" />
    <circle cx="300" cy="300" r="240" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.2" fill="none" stroke-dasharray="120 40 40 40" />
  </g>

  <!-- ROTATING HUD ORBITAL NODES -->
  <g class="hud-orbit-nodes">
    <circle cx="300" cy="30" r="4" fill="#00f0ff" filter="url(#neonGlow)" />
    <circle cx="570" cy="300" r="3" fill="#3b82f6" filter="url(#neonGlow)" />
    <circle cx="300" cy="570" r="5" fill="#a855f7" filter="url(#neonGlow)" />
    <circle cx="30" cy="300" r="4" fill="#00f0ff" filter="url(#neonGlow)" />
  </g>

  <!-- ANIMATED CIRCUIT PATH LINES (DRAW ON LOAD) -->
  <g class="circuit-lines" stroke-width="2" fill="none" filter="url(#subtleGlow)">
    <!-- Top Left Branch -->
    <path d="M 120 180 L 180 180 L 220 220" stroke="#00f0ff" stroke-opacity="0.6" stroke-dasharray="250" class="draw-path" />
    <circle cx="120" cy="180" r="3" fill="#00f0ff" />
    <circle cx="220" cy="220" r="2.5" fill="#00f0ff" />

    <!-- Top Right Branch -->
    <path d="M 480 180 L 420 180 L 380 220" stroke="#3b82f6" stroke-opacity="0.6" stroke-dasharray="250" class="draw-path" />
    <circle cx="480" cy="180" r="3" fill="#3b82f6" />
    <circle cx="380" cy="220" r="2.5" fill="#3b82f6" />

    <!-- Bottom Left Branch -->
    <path d="M 140 420 L 200 420 L 230 390" stroke="#a855f7" stroke-opacity="0.5" stroke-dasharray="250" class="draw-path" />
    <circle cx="140" cy="420" r="3" fill="#a855f7" />

    <!-- Bottom Right Branch -->
    <path d="M 460 420 L 400 420 L 370 390" stroke="#00f0ff" stroke-opacity="0.6" stroke-dasharray="250" class="draw-path" />
    <circle cx="460" cy="420" r="3" fill="#00f0ff" />
  </g>

  <!-- CHARACTER PORTRAIT VECTOR SILHOUETTE (SHLOK DUBEY) -->
  <g class="character-portrait" transform="translate(0, 10)">
    
    <!-- SHOULDERS & SUIT JACKET -->
    <!-- Back Body Silhouette -->
    <path d="M 130 540 C 130 450, 190 390, 240 370 L 360 370 C 410 390, 470 450, 470 540 Z" fill="url(#suitGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    
    <!-- White Dress Shirt Collar -->
    <polygon points="275,370 300,430 260,390" fill="#f8fafc" />
    <polygon points="325,370 300,430 340,390" fill="#f8fafc" />

    <!-- Dark Tie with Neon Accent Line -->
    <polygon points="290,390 310,390 315,480 300,500 285,480" fill="#0f172a" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="1" />
    <line x1="300" y1="390" x2="300" y2="495" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.8" filter="url(#subtleGlow)" />

    <!-- Suit Lapels -->
    <path d="M 190 430 L 260 390 L 285 490 L 210 540 Z" fill="#0b0f19" stroke="url(#lapelGrad)" stroke-width="1.5" />
    <path d="M 410 430 L 340 390 L 315 490 L 390 540 Z" fill="#0b0f19" stroke="url(#lapelGrad)" stroke-width="1.5" />

    <!-- Glowing Cyber Badge on Lapel -->
    <rect x="215" y="445" width="24" height="12" rx="3" fill="#030712" stroke="#00f0ff" stroke-width="1" />
    <circle cx="223" cy="451" r="2" fill="#00f0ff" filter="url(#neonGlow)" />
    <line x1="228" y1="451" x2="234" y2="451" stroke="#3b82f6" stroke-width="1.5" />

    <!-- NECK & CHIN STRUCTURE -->
    <path d="M 260 340 L 340 340 L 340 385 C 340 405, 260 405, 260 385 Z" fill="url(#skinGrad)" />
    <!-- Neck Shadow -->
    <path d="M 265 370 C 280 385, 320 385, 335 370 C 320 395, 280 395, 265 370 Z" fill="#090d16" opacity="0.6" />

    <!-- HEAD & JAWLINE CONTOUR -->
    <path d="M 220 220 C 220 150, 380 150, 380 220 C 380 285, 350 340, 300 345 C 250 340, 220 285, 220 220 Z" fill="url(#skinGrad)" stroke="#00f0ff" stroke-opacity="0.4" stroke-width="1.5" />

    <!-- EARS -->
    <path d="M 215 225 C 205 225, 205 255, 220 255 Z" fill="#1e293b" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1" />
    <path d="M 385 225 C 395 225, 395 255, 380 255 Z" fill="#1e293b" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1" />

    <!-- HAIR (STYLISH YOUNG PROFESSIONAL VOLUME & TEXTURE) -->
    <path d="M 210 210 C 205 140, 260 110, 300 110 C 350 110, 395 140, 390 210 C 380 180, 360 135, 300 135 C 245 135, 220 175, 210 210 Z" fill="#090d16" />
    <!-- Top Hair Strands & Highlights -->
    <path d="M 220 160 C 250 120, 330 115, 380 150 C 350 130, 280 130, 230 170 Z" fill="#1e293b" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1" />
    <path d="M 240 140 C 270 125, 320 125, 360 145 C 330 135, 280 135, 250 150 Z" fill="#334155" />

    <!-- FACIAL FEATURES -->
    <!-- Eyebrows -->
    <path d="M 245 210 Q 265 202 285 212" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 315 212 Q 335 202 355 210" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Eyes (Subtle Cybernetic Glow) -->
    <ellipse cx="265" cy="225" rx="10" ry="6" fill="#0f172a" stroke="#00f0ff" stroke-width="1" />
    <circle cx="265" cy="225" r="3.5" fill="#00f0ff" filter="url(#subtleGlow)" />
    <ellipse cx="335" cy="225" rx="10" ry="6" fill="#0f172a" stroke="#00f0ff" stroke-width="1" />
    <circle cx="335" cy="225" r="3.5" fill="#00f0ff" filter="url(#subtleGlow)" />

    <!-- Nose Contour -->
    <path d="M 300 220 L 297 260 L 306 262" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Mustache & Clean Beard Shadow Contour (Matching Shlok's Photo) -->
    <path d="M 275 278 Q 300 272 325 278 Q 300 286 275 278 Z" fill="#090d16" opacity="0.85" />
    <path d="M 260 275 C 260 320, 340 320, 340 275 C 340 330, 260 330, 260 275 Z" fill="#090d16" opacity="0.4" />

    <!-- Mouth Line -->
    <path d="M 282 288 Q 300 293 318 288" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- MODERN GLASSES (RECTANGULAR BLACK FRAMES WITH CYAN/PURPLE REFLECTION) -->
    <!-- Left Frame -->
    <rect x="240" y="210" width="52" height="32" rx="6" fill="url(#lensReflect)" stroke="#38bdf8" stroke-width="2.5" filter="url(#subtleGlow)" />
    <!-- Right Frame -->
    <rect x="308" y="210" width="52" height="32" rx="6" fill="url(#lensReflect)" stroke="#38bdf8" stroke-width="2.5" filter="url(#subtleGlow)" />
    <!-- Bridge -->
    <line x1="292" y1="222" x2="308" y2="222" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <!-- Frame Temples -->
    <line x1="240" y1="220" x2="220" y2="218" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="360" y1="220" x2="380" y2="218" stroke="#38bdf8" stroke-width="2.5" />

    <!-- Futuristic HUD Scan Line over Glasses -->
    <line x1="230" y1="226" x2="370" y2="226" stroke="#00f0ff" stroke-width="1" stroke-dasharray="6 4" opacity="0.7" filter="url(#neonGlow)" />

  </g>

  <!-- FOREGROUND AMBIENT FLOATING DATA PARTICLES -->
  <g class="ambient-particles">
    <circle cx="160" cy="140" r="2" fill="#00f0ff" opacity="0.8" />
    <circle cx="440" cy="140" r="1.5" fill="#3b82f6" opacity="0.9" />
    <circle cx="100" cy="340" r="2" fill="#a855f7" opacity="0.7" />
    <circle cx="500" cy="340" r="2.5" fill="#00f0ff" opacity="0.8" />
    <circle cx="200" cy="500" r="1.5" fill="#3b82f6" opacity="0.6" />
    <circle cx="400" cy="500" r="2" fill="#a855f7" opacity="0.7" />
  </g>
</svg>
