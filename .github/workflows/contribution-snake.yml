name: Generate Contribution Snake

on:
  schedule:
    # Run every 24 hours at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate GitHub Contribution Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Shlok-29
          outputs: |
            assets/github-contribution-snake.svg?palette=github-dark&color_snake=#00f0ff

      - name: Commit and Push Updated Contribution Snake
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update github contribution snake animation [skip ci]"
          file_pattern: "assets/github-contribution-snake.svg"
